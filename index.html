<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shania</title>
  <style>
    :root {
      --ink: #1c1915;
      --muted: #5c564c;
      --paper: #f3eee6;
      --card: #fffdf8;
      --line: #e4d9c8;
      --accent: #8d3d2b;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #f8e7d4 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 10%, #ead9c4 0%, transparent 50%),
        var(--paper);
    }

    main {
      max-width: 40rem;
      margin: 12vh auto;
      padding: 3rem 2.25rem 2.5rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      box-shadow: 0 24px 60px rgba(60, 40, 20, 0.08);
    }

    .mark {
      width: 2.75rem;
      height: 0.28rem;
      margin: 0 0 1.5rem;
      background: var(--accent);
      border-radius: 999px;
    }

    h1 {
      margin: 0 0 0.85rem;
      font-size: clamp(3rem, 8vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.95;
    }

    p {
      margin: 0;
      max-width: 32rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      main {
        margin: 1.5rem;
        padding: 2.25rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Shania</h1>
    <p>A small static page, published from the root of this repository. No build step — just this file, served by GitHub Pages.</p>
  </main>
</body>
</html>

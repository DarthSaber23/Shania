<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9f1239">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shania">
  <meta name="description" content="Are you sure, Shania?">
  <title>Are you sure?</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try {
      var root = document.documentElement;
      var INACTIVITY_MS = 15 * 60 * 1000;
      var ABSOLUTE_MS = 60 * 60 * 1000;
      var verified = localStorage.getItem("shania.gate.verified") === "1";
      var session = null;
      try {
        session = JSON.parse(localStorage.getItem("shania.gate.session") || "null");
      } catch (parseError) {
        session = null;
      }
      var now = Date.now();
      var fresh = !!(verified && session
        && typeof session.verifiedAt === "number"
        && typeof session.lastActivityAt === "number"
        && now - session.verifiedAt < ABSOLUTE_MS
        && now - session.lastActivityAt < INACTIVITY_MS);
      if (fresh) {
        root.classList.add("is-verified");
      } else {
        root.classList.add("is-gated");
        if (!verified && localStorage.getItem("shania.gate.pending")) root.classList.add("has-code");
      }
    } catch (error) {
      document.documentElement.classList.add("is-gated");
    }
  </script>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="float-heart h1">♥</span>
    <span class="float-heart h2">♥</span>
    <span class="float-heart h3">♥</span>
    <span class="float-heart h4">♥</span>
    <span class="float-heart h5">♥</span>
    <span class="float-heart h6">♥</span>
  </div>
  <div id="safe-probe" aria-hidden="true"></div>
  <section class="gate scene" data-verify-gate aria-labelledby="gate-title">
    <p class="big-heart" aria-hidden="true">♥</p>
    <p class="eyebrow">For you</p>
    <h1 id="gate-title">Verifikasi dulu ya</h1>
    <p class="note gate-lead">Kirim kodenya dulu, nanti tinggal masukin di sini.</p>
    <p class="gate-error gate-expired" data-gate-expired role="alert" hidden></p>
    <p class="note gate-sent">Kode sudah dikirim. Masukin di sini ya.</p>
    <div class="gate-send-wrap">
      <button class="btn yes gate-send" type="button" data-gate-send>Kirim kode verifikasi</button>
      <p class="gate-error" data-gate-send-error role="alert" hidden></p>
    </div>
    <form class="gate-form" data-gate-form onsubmit="return false">
      <label class="gate-label" for="gate-code">Kode verifikasi</label>
      <input class="gate-code" id="gate-code" data-gate-code name="code" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-describedby="gate-wa">
      <p class="note gate-wa" id="gate-wa" data-gate-wa>Kode belum masuk? Chat Fajar di WhatsApp ya 😊</p>
      <p class="gate-error" data-gate-error role="alert" hidden></p>
      <div class="gate-actions">
        <button class="btn yes" type="submit">Masuk</button>
        <button class="btn no" type="button" data-gate-resend aria-describedby="gate-timer">Kirim ulang kode</button>
      </div>
      <p class="gate-timer" id="gate-timer" data-gate-timer></p>
    </form>
  </section>
  <main class="scene" id="page-main" data-avoid>
    <p class="eyebrow">Shania</p>
    <h1>Are you sure?</h1>
    <p class="note">Shania, my heart is still hoping.</p>
    <div class="choices">
      <button class="btn yes" type="button" data-dodge="endless">Yes</button>
      <a class="btn no" href="index.html">No</a>
    </div>
  </main>
  <script type="module" src="js/app.mjs"></script>
</body>
</html>

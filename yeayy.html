<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9f1239">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shania">
  <meta name="description" content="Yeayy! Shania said yes.">
  <title>Yeayy!</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="float-heart h1">♥</span>
    <span class="float-heart h2">♥</span>
    <span class="float-heart h3">♥</span>
    <span class="float-heart h4">♥</span>
    <span class="float-heart h5">♥</span>
    <span class="float-heart h6">♥</span>
  </div>
  <div class="burst" data-celebrate aria-hidden="true"></div>
  <div id="safe-probe" aria-hidden="true"></div>
  <main class="scene">
    <p class="big-heart" aria-hidden="true">♥</p>
    <p class="eyebrow">For us</p>
    <h1>Yeayy!</h1>
    <p class="note">I'm so happyyy… I'm gonna die!</p>
    <div class="player" data-player data-video="tt6FPKyQamk">
      <div class="player-frame" data-player-frame data-view="loading">
        <div id="yt-player" data-yt-slot></div>
        <div class="player-veil" data-player-veil data-mode="loading">
          <p class="player-status" data-player-status aria-live="polite">Getting the video ready…</p>
          <button class="btn yes player-action" type="button" data-player-action hidden>Tap to play</button>
        </div>
        <div class="player-fallback" data-player-fallback hidden>
          <p class="player-status">The video wouldn't load here.</p>
          <a class="btn yes player-link" href="https://www.youtube.com/watch?v=tt6FPKyQamk" rel="noopener noreferrer" target="_blank">Watch on YouTube</a>
        </div>
      </div>
      <noscript>
        <style>.player-veil { display: none !important; }</style>
        <p class="player-noscript">The video wouldn't load here. <a href="https://www.youtube.com/watch?v=tt6FPKyQamk">Watch on YouTube</a></p>
      </noscript>
    </div>
  </main>
  <script type="module" src="js/app.mjs"></script>
</body>
</html>
